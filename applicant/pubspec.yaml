name: digital_housing_society
version: 1.0.0+1
publish_to: 'none'
description: Digital Housing Society Applicant Module built with Flutter, Firebase, Material 3 and MVVM.

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  provider: ^6.1.1
  image_picker: ^1.1.2
  file_picker: ^11.0.1
  intl: ^0.18.1
  share_plus: ^7.2.1
  cloudinary_public: ^0.23.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/backgrounds/
    - assets/dealers/
