name: digital_housing_society
description: Premium Flutter Admin Panel for Digital Housing Society.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.0.0
  cloud_firestore: ^6.0.0
  firebase_auth: ^6.5.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/admin_realestate.png
    - assets/images/modern_apartment.png
    - assets/images/Green_Valley_Villa.png
    - assets/images/Royal Enclave.png
    - assets/images/Sunshine Residency.png
    - assets/images/admin_purple.png